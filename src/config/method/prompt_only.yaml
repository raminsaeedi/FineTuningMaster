# Method A — prompt-only (baseline).
name: prompt_only
type: prompt_only
generate:
  # Shared across A/B/C/D. 512 bounds KV-cache growth on 27B inference while
  # preserving enough space for the structured dashboard JSON response.
  max_new_tokens: 512
  temperature: 0.1        # low temperature for structured JSON output
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.15
