# Method C — fine-tuned. Loads the adapter produced by experiments/scripts/train.py.
#
# Leave adapter_path null: it resolves to this run's own adapter folder
#   ${output_root}/${experiment_id}/adapter
# which is exactly where training writes it. For local inference against an
# adapter trained elsewhere, copy that folder to the same path, or set
# adapter_path explicitly.
name: ft
type: fine_tuned
adapter_path: null
adapter_source_experiment: null
adapter_source_method_key: null
allow_training_config_mismatch: false
inference:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
generate:
  # Keep identical across A/B/C/D for a fair comparison.
  max_new_tokens: 512
  temperature: 0.1
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.15
