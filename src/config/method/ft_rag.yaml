# Method D — fine-tuned + RAG. Combines the adapter (method C) with retrieval
# (method B).
#
# The adapter belongs to the method C run with the same model, dataset and seed,
# not to this experiment. Leave adapter_path null and name the producing run in
# adapter_source_experiment: the path is then resolved to
#   ${output_root}/<adapter_source_experiment>_${seed}/adapter
# so seed 43 automatically consumes the seed-43 adapter. Set adapter_path only to
# override that deliberately.
name: ft_rag
type: fine_tuned_rag
adapter_path: null
adapter_source_experiment: E03_qwen0_5b_ft
adapter_source_method_key: null
retriever:
  name: tfidf
  top_k: 3
  chunks_path: data/knowledge_base/chunks.jsonl
inference:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
generate:
  # Keep identical across A/B/C/D for a fair comparison.
  max_new_tokens: 512
  temperature: 0.1
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.15
