rule_version: nvbench_quality_v6

identifier:
  strong_unique_ratio: 0.98
  strong_min_distinct: 20
  ambiguous_unique_ratio: 0.5
  name_patterns:
    - "(^|_)id$"
    - "^id(_|$)"
    - "identifier"
    - "(^|_)key$"
    - "(^|_)code$"
  entity_reference_patterns:
    - "(^|_)id$"
    - "^id(_|$)"
    - "identifier"
    - "(^|_)key$"
    - "(^|_)code$"
  # Identity-qualified number fields need both semantic naming and observed
  # cardinality evidence. Quantity names such as number_of_rooms do not match.
  entity_number_patterns:
    - "(^|_)(card|account|customer|member|policy|invoice|order|ticket|serial|registration|passport|phone|room|flight|employee|student|player|product|case|claim|document|reference|transaction|contract|permit|license)_(number|no)$"
  entity_number_min_unique_ratio: 0.9
  entity_number_min_distinct: 5

chart:
  pie:
    max_categories: 8
    # Part-to-whole composition requires an additive measure: slices must sum
    # to a meaningful whole. AVG/MIN/MAX over a category is source-faithful but
    # not additive -- Tier B, never Tier A.
    additive_aggregates: ["COUNT", "SUM"]
    prohibited_aggregates: ["AVG", "MIN", "MAX"]
    non_additive_reason_code: "pie_non_additive_kpi"
    allow_negative_values: false
    allow_identifier_category: false
  scatter:
    min_distinct_values: 10
    result_profile_max_rows: 1000
    identifier_axis_reason_code: "scatter_identifier_axis"
    invalid_axes_reason_code: "invalid_scatter_axes"
  stacked_bar:
    max_group_cardinality: 8

# Time-grain preservation (v2). A source-supported time grain (explicit SQL/VQL
# time function, or an x-axis over a database-confirmed datetime column that the
# query groups/orders on) must be recorded in the transformed record's
# constraints.time_grain, else `missing_required_time_grain` (mandatory).
time_grain:
  supported: ["YEAR", "MONTH", "DAY", "WEEKDAY", "WEEK", "QUARTER", "HOUR", "DATE"]
  # Fallback name hints, used ONLY when the database cannot confirm the dtype.
  name_hints: ["date", "time", "year", "month", "day", "week", "quarter", "hour"]
  # Charts for which a datetime x-dimension implies a required grain.
  temporal_charts: ["line", "bar"]

scoring:
  weights:
    source_fidelity: 30
    kpi_validity: 20
    chart_suitability: 25
    constraint_completeness: 15
    db_profile_support: 10
  tier_a_min_score: 90

sampling:
  seed: 42
  target_per_chart: 20
  db_cap: 10
  near_dup_threshold: 0.8
