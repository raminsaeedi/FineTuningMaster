# QLoRA — the implemented, default training algorithm. Values mirror the proven
# trainer migrated from the original pipeline.
type: qlora_sft

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  # PEFT resolves every supported linear projection for both Qwen and Llama.
  target_modules: all-linear

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true

sft:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  optim: adamw_torch
  warmup_ratio: 0.1
  weight_decay: 0.01
  precision: auto
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 50
  save_total_limit: 4
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: "none"
  gradient_checkpointing: true
  dataloader_pin_memory: false
  packing: false
  # Compatibility default: false reproduces existing full-sequence C/D runs.
  # Set true for a new, separately identified response-only ablation/run.
  completion_only_loss: false
