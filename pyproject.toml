[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# Poetry (2.x) is the authoritative dependency manager for this project.
# `poetry.lock` is the single source of truth for exact versions; the ranges
# below only describe what the code actually imports. requirements-train.txt is
# a GENERATED export kept for pip-only machines — never edit it by hand.
[project]
name = "thesis-dashboard-llm"
version = "0.2.0"
description = "Fine-tuning LLMs for structured dashboard design recommendations"
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Main group: everything inference, evaluation, statistics and the experiment
# runner need.
#
# Every version here is the exact one the thesis experiments were verified
# against (2026-08). They are pinned, not ranged, so `poetry.lock` reproduces
# the measured environment instead of silently drifting to newer releases.
dependencies = [
    "torch==2.6.0",
    "transformers==5.7.0",
    "huggingface-hub==1.13.0",
    "pydantic==2.11.4",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "numpy==2.2.6",
    "scipy==1.16.1",
    "scikit-learn==1.8.0",
    "pandas==2.2.3",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
# Training group (methods C and D) — QLoRA on the GPU machine.
# Pinned to the versions the migrated trainer is verified against.
train = [
    "peft==0.19.1",
    "trl==1.3.0",
    "bitsandbytes==0.49.2",
    "accelerate==1.13.0",
    "datasets==4.8.5",
]
# Human-evaluation UI (src/evaluation/human/streamlit_app.py).
human = [
    "streamlit>=1.30,<2.0",
]
# Dataset enrichment against an OpenAI-compatible gateway
# (src/data_pipeline/enrichment_provider.py). Not needed to run experiments:
# the frozen datasets are already in the repository.
enrichment = [
    "openai>=1.30,<2.0",
]
# Constrained JSON decoding (src/inference/decoders.py, lazy import).
constrained = [
    "outlines>=0.0.46",
]
# Dense embedding retriever + semantic grounding metric (both lazy imports).
rag-dense = [
    "sentence-transformers>=2.6",
]
# GaLore full-parameter fine-tuning (src/training/galore_trainer.py, lazy).
galore = [
    "galore-torch>=1.0",
]
# G-Eval (LLM-as-judge) needs no package — it uses urllib against an
# OpenAI-compatible endpoint (set OPENAI_API_KEY / OPENAI_BASE_URL).

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "src" }]

# Development-only group. Not part of any extra, so a professor install never
# pulls it unless they ask for it with `--with dev`.
[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
# The enrichment-provider tests introspect the OpenAI SDK signature, so the
# dev environment needs the same package as the `enrichment` extra.
openai = ">=1.30,<2.0"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
