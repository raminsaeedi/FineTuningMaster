name: ftm_h100_qwen38

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - git
  - git-lfs
  - pip:
      # PyTorch 2.6.0 has an official CUDA 12.4 wheel. CUDA 12.5 is not a
      # PyTorch wheel channel; a sufficiently new NVIDIA driver runs cu124.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - transformers==5.7.0
      - huggingface-hub==1.13.0
      - pydantic==2.11.4
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - numpy==2.2.6
      - scipy==1.16.1
      - scikit-learn==1.8.0
      - pandas==2.2.3
      - pyyaml==6.0.2
      - matplotlib==3.10.7
      - peft==0.19.1
      - trl==1.3.0
      - bitsandbytes==0.49.2
      - accelerate==1.13.0
      - datasets==4.8.5
      - psutil==7.2.2
      - pytest>=8.0,<9.0

variables:
  PYTHONNOUSERSITE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  TOKENIZERS_PARALLELISM: "false"
  CUDA_MODULE_LOADING: "LAZY"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
